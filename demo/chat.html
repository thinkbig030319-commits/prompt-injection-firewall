<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGuard — Protected Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<style>
  :root {
    --bg: #0b0d0f; --panel: #12161a; --border: #232a30; --text: #d8dee3; --muted: #6b7680;
    --mono: "SF Mono", "IBM Plex Mono", "Courier New", monospace;
    --allow: #4fd68a; --flag: #e8b84b; --block: #e8544b; --accent: #4fa8d6;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 20px; }
  .wrap { width:100%; max-width:720px; }
  .brand { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
  h1 { font-size:20px; margin:0; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px 19px; }
  nav { margin-bottom:24px; display:flex; gap:14px; font-size:12px; }
  nav a { color:var(--muted); text-decoration:none; }
  nav .active { color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:4px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:20px; }
  #messages { display:flex; flex-direction:column; gap:12px; min-height:280px; max-height:440px; overflow-y:auto; margin-bottom:14px; }
  .msg { padding:10px 14px; border-radius:6px; font-size:13px; line-height:1.5; max-width:85%; }
  .msg.user { align-self:flex-end; background:#1c2b36; border:1px solid #2a3f4d; }
  .msg.ai { align-self:flex-start; background:#161b1f; border:1px solid var(--border); }
  .msg.ai p { margin:0 0 8px 0; } .msg.ai p:last-child { margin-bottom:0; }
  .msg.ai strong { color:#fff; } .msg.ai code { background:#0e1215; padding:1px 5px; border-radius:3px; font-size:12px; }
  .msg.ai ul, .msg.ai ol { margin:4px 0; padding-left:20px; }
  .msg.ai h1, .msg.ai h2, .msg.ai h3 { font-size:14px; color:var(--accent); margin:10px 0 6px 0; }
  .msg.blocked { align-self:flex-start; background:#2a1518; border:1px solid #5a2a2f; color:#e8a5a0; }
  .msg .meta { font-size:10px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:0.05em; }
  .msg.blocked .meta { color:var(--block); }
  .input-row { display:flex; gap:8px; }
  input[type=text] { flex:1; background:#0e1215; border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:var(--mono); font-size:14px; padding:10px 12px; }
  input[type=text]:focus { outline:1px solid var(--accent); }
  button { background:var(--accent); color:#06181f; border:none; font-family:var(--mono); font-weight:700; font-size:13px; padding:10px 18px; border-radius:4px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  footer { margin-top:20px; color:var(--muted); font-size:11px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot"></div><h1>PromptGuard</h1></div>
  <p class="sub">protected chat — every message passes through the firewall first</p>
  <nav>
    <a href="/">Checker</a>
    <span class="active">Protected Chat</span>
    <a href="/dashboard.html">Dashboard</a>
  </nav>

  <div class="panel">
    <div id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Type a message... try a normal question, or a jailbreak attempt">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <footer>Blocked messages never reach the AI model. Set GEMINI_API_KEY (free) to connect a real model — otherwise this runs in demo mode.</footer>
</div>

<script>
const messagesEl = document.getElementById('messages');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bodyHtml = (role === 'ai' && window.marked) ? marked.parse(text) : '<div>' + text.replace(/</g,'&lt;') + '</div>';
  div.innerHTML = bodyHtml + (meta ? '<div class="meta">' + meta + '</div>' : '');
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text })
    });
    const data = await res.json();

    if (data.blocked) {
      addMessage('blocked', 'Message blocked by firewall — not sent to the AI.',
        'verdict: ' + data.verdict + ' · risk: ' + data.risk_score.toFixed(2) + ' · ' + data.reasons.join(', '));
    } else {
      const flag = data.output_flagged ? ' ⚠ output flagged' : '';
      addMessage('ai', data.reply, 'verdict: ' + data.verdict + ' · risk: ' + data.risk_score.toFixed(2) + flag);
    }
  } catch (e) {
    addMessage('blocked', 'Error contacting server: ' + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
